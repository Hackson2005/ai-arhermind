<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0d0d14" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="AI ARHERMIND" />
  <title>AI ARHERMIND</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ── Header ─────────────────────────────────────────────────────────── -->
  <header>
    <div class="header-left">
      <div class="logo" aria-hidden="true">✦</div>
      <div class="header-text">
        <span class="app-title">Aether</span>
        <span class="app-sub">Local intelligence · Online when needed</span>
      </div>
    </div>
    <div class="model-pill">AI ARHERMIND 0.9 <span>⌄</span></div>
    <div id="status" class="status online">● ONLINE</div>
  </header>

  <!-- ── Chat window ────────────────────────────────────────────────────── -->
  <main id="chatWindow">
    <div class="boot-msg">
      <div class="boot-banner">How can I help?</div>
      <div class="boot-sub">Ask anything. Aether thinks locally, then searches for what it does not know.</div>
      <div class="boot-hint"><span>Explain quantum computing</span><span>Calculate 15% of 240</span><span>Tell me a joke</span></div>
    </div>
  </main>

  <!-- ── Input bar ──────────────────────────────────────────────────────── -->
  <footer>
    <div class="input-row">
      <input
        type="text"
        id="userInput"
        placeholder="Ask Aether anything..."
        autocomplete="off"
        autocorrect="off"
        autocapitalize="off"
        spellcheck="false"
      />
      <button id="micBtn" type="button" aria-label="Start voice input" title="Start voice input">&#127908;</button>
      <button id="voiceBtn" type="button" aria-label="Turn voice replies off" title="Turn voice replies off">&#128266;</button>
      <button id="sendBtn" onclick="handleSend()">&#9658;</button>
    </div>
    <div class="composer-note"><span>✦ Aether can make mistakes.</span><span>Responses may use online sources.</span></div>
  </footer>

  <script src="aether.js"></script>
</body>
</html>
